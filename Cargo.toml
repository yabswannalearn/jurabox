[package]
name = "jurabox"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Project workspaces and service management for Windows"
repository = "https://github.com/yabswannalearn/jurabox"
publish = false

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
tempfile = "3.0"
slint = { version = "=1.18.1", default-features = false, features = [
    "std", "backend-winit", "renderer-femtovg", "renderer-software",
    "accessibility", "compat-1-18", "system-tray", "raw-window-handle-06",
] }
raw-window-handle = "0.6"
png = "0.18"
url = "2.5"

[build-dependencies]
slint-build = "=1.18.1"

[target.'cfg(windows)'.dependencies]
winvd = "=0.0.49"
# Match winvd's windows crate so window handle types remain compatible.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_RemoteDesktop",
    "Win32_Networking_WinHttp",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
