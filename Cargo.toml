[package]
name = "jurabox"
version = "0.1.0"
edition = "2024"
description = "Project workspaces and service management for Windows"
repository = "https://github.com/yabswannalearn/jurabox"
publish = false

[dependencies]
anyhow = "1.0"

[target.'cfg(windows)'.dependencies]
winvd = "=0.0.49"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
